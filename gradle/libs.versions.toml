# Version catalog: versiones de dependencias y plugins en un solo lugar.
# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format

[versions]
# Debe coincidir con el Ice instalado (slice2java)
ice = "3.7.11"
ice-builder = "1.5.2"

[libraries]
ice = { module = "com.zeroc:ice", version.ref = "ice" }

[plugins]
ice-builder = { id = "com.zeroc.gradle.ice-builder.slice", version.ref = "ice-builder" }
