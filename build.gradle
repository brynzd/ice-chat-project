allprojects{
    repositories{
        mavenCentral()
    }
}

subprojects{
    apply plugin: 'java'
    java{
        sourceCompatibility = javaVersion.VERSION_17
        targetCompatibility = javaVersion.VERSION_17
    }

    dependencies{
        implementation 'com.zerocc:ice:3.7.10'
    }
}
