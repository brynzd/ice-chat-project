// Configuracion compartida por todos los modulos (common, server, client)

allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    // Compila para Java 17 sin importar la version del JDK instalado (17, 21, 26...)
    tasks.withType(JavaCompile).configureEach {
        options.release = 17
        options.encoding = 'UTF-8'
    }
}
